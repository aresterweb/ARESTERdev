<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Berita — ARESTERnews</title>
<meta name="description" content="Baca berita lengkap dari ARESTERnews.">
<link rel="icon" href="assets/aresterdev-logo-original.png">
<link rel="stylesheet" href="assets/style.css">
<style>
.article-wrap{max-width:850px;margin:42px auto;padding:0 20px}
.article-back{display:inline-block;margin:12px 0 24px}
.article-panel{border:1px solid #24435c;border-radius:18px;padding:clamp(20px,4vw,42px);background:rgba(8,27,43,.78)}
.article-category{display:inline-block;color:#72d7ff;font-weight:700}
.article-title{font-size:clamp(2rem,6vw,3.4rem);line-height:1.12;margin:.35em 0}
.article-meta{opacity:.75;font-size:.95rem;line-height:1.8}
.article-cover{display:block;width:100%;max-height:480px;object-fit:cover;border-radius:12px;margin:26px 0}
.article-body{font-size:1.08rem;line-height:1.9;overflow-wrap:anywhere;white-space:pre-wrap}
.article-source{border-top:1px solid #24435c;margin-top:30px;padding-top:18px}
.article-status{padding:24px 0}
</style>

<style id="arester-article-professional">
/* ARESTERnews — long-form editorial reading experience */
:root{--article-line:rgba(157,190,220,.17);--article-muted:#a4b4c8;--article-cyan:#70def7}
body{background:radial-gradient(ellipse at 50% 0%,rgba(19,85,126,.18),transparent 34%),#070b17}
.article-wrap{width:min(920px,calc(100% - 40px));max-width:920px;margin:0 auto;padding:26px 0 90px}
.article-back{display:inline-flex;align-items:center;gap:10px;margin:10px 0 30px;padding:9px 14px;border:1px solid var(--article-line);border-radius:999px;color:#c2d1e1;font-size:12px;font-weight:650;transition:border-color .2s,color .2s}
.article-back:hover{border-color:rgba(112,222,247,.55);color:var(--article-cyan)}
.article-panel{padding:clamp(22px,5vw,58px)!important;border:1px solid var(--article-line)!important;border-radius:22px!important;background:linear-gradient(155deg,rgba(13,27,44,.97),rgba(7,15,27,.98))!important;box-shadow:0 25px 80px rgba(0,0,0,.23)}
.article-category{display:inline-flex;align-items:center;padding:6px 11px;margin:0 0 18px;border:1px solid rgba(112,222,247,.25);border-radius:5px;background:rgba(44,151,189,.09);color:var(--article-cyan)!important;font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
.article-title{font-size:clamp(32px,6vw,60px)!important;line-height:1.09!important;letter-spacing:-.048em!important;font-weight:760!important;margin:0 0 23px!important;color:#f4f8fc}
.article-meta{font-size:12px!important;line-height:1.9!important;color:var(--article-muted)!important}
.article-cover{width:100%;max-height:540px;object-fit:cover;border-radius:13px!important;margin:30px 0!important;border:1px solid var(--article-line)}
.article-panel>p>strong{display:block;margin:5px 0 28px;color:#d9e5f1;font-size:clamp(17px,2.5vw,21px);line-height:1.75;font-weight:500}
.article-body{max-width:720px;margin:28px auto 0;font-size:17px!important;line-height:2!important;letter-spacing:.002em;color:#d0dbe8;overflow-wrap:anywhere}
.article-body br{content:"";display:block;margin-bottom:12px}
.article-source{max-width:720px;margin:42px auto 0!important;padding:22px 0 0!important;border-top:1px solid var(--article-line)!important;color:#9eafc4;font-size:13px;line-height:1.8}
.article-source strong{display:block;margin-bottom:5px;color:#e4edf7;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.article-source a{color:var(--article-cyan);text-decoration:underline;text-decoration-color:rgba(112,222,247,.35);text-underline-offset:4px}
.article-status{padding:32px 0;color:var(--article-muted)}
.article-panel>.article-meta:last-child{margin-top:25px}
@media(max-width:600px){.article-wrap{width:calc(100% - 28px);padding-top:14px}.article-back{margin-bottom:20px}.article-panel{padding:22px 19px!important;border-radius:16px!important}.article-title{font-size:clamp(31px,9vw,43px)!important}.article-cover{margin:23px 0!important;border-radius:9px!important}.article-body{font-size:16px!important;line-height:1.9!important}}
</style>

</head>
<body>
<header class="site-header"><div class="container nav-wrap">
<a href="index.html" aria-label="ARESTERdev Home"><img src="assets/aresterdev-logo-original.png" alt="ARESTERdev" style="width:44px;height:44px;object-fit:contain"></a>
<nav class="main-nav" aria-label="Navigasi berita"><a href="index.html">Home</a><a href="blog/index.html">Artikel</a><a class="active" href="news.html">ARESTERnews</a></nav>
</div></header>
<main class="article-wrap">
<a class="article-back" href="news.html">← Kembali ke ARESTERnews</a>
<div id="article-result" class="article-status" aria-live="polite">Memuat artikel…</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/aresternews-config.js?v=20261010-article1"></script>
<script>
(() => {
  const host = document.getElementById('article-result');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
  document.addEventListener('DOMContentLoaded', async () => {
    const cfg = window.ARESTERNEWS_CONFIG;
    if (!cfg || !window.supabase) {
      host.textContent = 'Konfigurasi berita belum tersedia.';
      return;
    }
    const slug = new URLSearchParams(location.search).get('slug');
    if (!slug) {
      host.textContent = 'Artikel tidak ditemukan. Silakan pilih berita dari halaman ARESTERnews.';
      return;
    }
    const client = window.supabase.createClient(cfg.url, cfg.key);
    const {data:a,error} = await client.from('aresternews_articles')
      .select('title,slug,excerpt,content,cover_url,published_at,created_at,category,author_name,location,tags,source_name,source_url')
      .eq('slug', slug).eq('status','published').maybeSingle();
    if (error || !a) {
      host.textContent = 'Artikel tidak ditemukan atau belum diterbitkan.';
      return;
    }
    const date = new Date(a.published_at || a.created_at);
    host.className = 'article-panel';
    host.innerHTML = `
      ${a.category ? `<p class="article-category">${esc(a.category)}</p>` : ''}
      <h1 class="article-title">${esc(a.title)}</h1>
      <p class="article-meta">
        ${esc(date.toLocaleDateString('id-ID',{dateStyle:'long'}))}
        ${a.author_name ? ` · Penulis: ${esc(a.author_name)}` : ''}
        ${a.location ? ` · ${esc(a.location)}` : ''}
      </p>
      ${a.cover_url ? `<img class="article-cover" src="${esc(a.cover_url)}" alt="Gambar: ${esc(a.title)}">` : ''}
      ${a.excerpt ? `<p><strong>${esc(a.excerpt)}</strong></p>` : ''}
      <div class="article-body">${esc(a.content).replace(/\n/g,'<br>')}</div>
      ${a.tags ? `<p class="article-meta">Topik: ${esc(a.tags)}</p>` : ''}
      ${a.source_name ? `<div class="article-source"><strong>Sumber berita:</strong> ${a.source_url ? `<a href="${esc(a.source_url)}" target="_blank" rel="noopener noreferrer">${esc(a.source_name)}</a>` : esc(a.source_name)}</div>` : ''}
    `;
    document.title = a.title + ' — ARESTERnews';
  });
})();
</script>
</body>
</html>
